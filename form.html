<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab16 - Form</title>

    <style>
        .valid {
            color: green;
        }

        .invalid {
            color: red;
        }
    </style>
</head>

<body>
    <h1>Create an Account</h1>

    <form id="myForm">
        <label for="name">Name:</label>
        <input type="text" id="name" placeholder="Name" required>

        <br><br>

        <label for="email">Email:</label>
        <input type="email" id="email" placeholder="E-Mail" required>

        <br><br>

        <label for="password">Password:</label>
        <input type="password" id="password" placeholder="Password" required>

        <div id="passwordRules" hidden>
            <p id="length" class="invalid">At least 6 characters</p>
            <p id="special" class="invalid">Must include a special character (!@#$...)</p>
            <p id="uppercase" class="invalid">Must include an uppercase letter (A-Z)</p>
        </div>

        <br>
        <br>

        <button type="submit">Submit</button>
    </form>

    <script>
        const myForm = document.getElementById("myForm");
        const password = document.getElementById("password");
        const passwordRules = document.getElementById("passwordRules");

        const length = document.getElementById("length");
        const special = document.getElementById("special");
        const uppercase = document.getElementById("uppercase");

        password.addEventListener("input", () => {
            const value = password.value;

            passwordRules.hidden = value.length == 0;

            const hasLength = value.length >= 6;
            const hasSpecial = /[!@#$%^&*(),.?":{}|<>]/.test(value);
            const hasUppercase = /[A-Z]/.test(value);

            length.classList.toggle("valid", hasLength);
            length.classList.toggle("invalid", !hasLength);

            special.classList.toggle("valid", hasSpecial);
            special.classList.toggle("invalid", !hasSpecial);

            uppercase.classList.toggle("valid", hasUppercase);
            uppercase.classList.toggle("invalid", !hasUppercase);
        });

        myForm.addEventListener("submit", (event) => {
            event.preventDefault();
            window.location.href = "success.html";
        });
    </script>
</body>

</html>
